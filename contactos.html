<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Explora Guayaquil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo-container">
        <img src="images/logo.png" alt="Logo Explora Guayaquil">
        <h1>Explora Guayaquil</h1>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="destinos.html">Destinos</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contacto.html" class="active">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">Formulario de Reserva y Contacto</h2>

    <div class="form-container">
      <form action="#" method="post">
        
        <div class="form-group">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Mario Rivas" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="usuario@correo.com" required>
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono / WhatsApp:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="0991234567" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="destino">Atractivo o Actividad:</label>
            <select id="destino" name="destino" required>
              <option value="">-- Seleccione una opción --</option>
              <option value="malecon">Malecón 2000</option>
              <option value="las-penas">Barrio Las Peñas</option>
              <option value="parque-historico">Parque Histórico</option>
              <option value="tour-gastronomico">Tour Gastronómico</option>
              <option value="paseo-barco">Paseo en Barco Río Guayas</option>
            </select>
          </div>

          <div class="form-group">
            <label for="servicio">Tipo de Servicio:</label>
            <select id="servicio" name="servicio" required>
              <option value="">-- Tipo de Servicio --</option>
              <option value="tour-privado">Tour Privado</option>
              <option value="tour-grupal">Tour Grupal</option>
              <option value="paquete-completo">Paquete Fin de Semana</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="fecha">Fecha Tentativa:</label>
            <input type="date" id="fecha" name="fecha" required>
          </div>

          <div class="form-group">
            <label for="personas">Número de Personas:</label>
            <input type="number" id="personas" name="personas" min="1" max="50" value="1" required>
          </div>
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje o Requerimiento Especial:</label>
          <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí tus inquietudes..."></textarea>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">Enviar Reserva</button>

      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Explora Guayaquil - Proyecto Académico Examen Final | Desarrollado por Mario Avelino Rivas Zambrano</p>
  </footer>

</body>
</html>
